name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Normalize project directory
        run: |
          if [ ! -f "package.json" ] && [ -f "xmusic-tauri/package.json" ]; then
            shopt -s dotglob
            mv xmusic-tauri/* .
            rmdir xmusic-tauri || true
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform, build-tools, NDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install dependencies
        run: npm install

      - name: Generate icons
        run: npx tauri icon app-icon.png

      - name: Init Android project
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/26.1.10909125"
          npx tauri android init
          MANIFEST="src-tauri/gen/android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i 's/android:usesCleartextTraffic="${usesCleartextTraffic}"/android:usesCleartextTraffic="true"/g' "$MANIFEST"
          fi

      - name: Build APK (universal)
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/26.1.10909125"
          npx tauri android build --apk

      - name: Sign APK
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          APK=$(find src-tauri/gen/android -name "*.apk" -path "*release*" | head -n 1)
          echo "APK ditemukan: $APK"
          BT="$ANDROID_HOME/build-tools/34.0.0"
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > ks.jks
            PASS="$KS_PASS"
          else
            PASS="xmusic123"
            rm -f ks.jks
            keytool -genkeypair -v -keystore ks.jks -alias xmusic -keyalg RSA -keysize 2048 -validity 10000               -storepass "$PASS" -keypass "$PASS" -dname "CN=Xmusic"
          fi
          "$BT/zipalign" -f -p 4 "$APK" aligned.apk
          "$BT/apksigner" sign             --ks ks.jks             --ks-key-alias xmusic             --ks-pass pass:"$PASS"             --key-pass pass:"$PASS"             --v1-signing-enabled true             --v2-signing-enabled true             --v3-signing-enabled true             --out Xmusic.apk             aligned.apk
          "$BT/apksigner" verify -v Xmusic.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Xmusic-apk
          path: Xmusic.apk

      - name: Publish APK to GitHub Releases
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "nys Xmusic APK v1.0.${{ github.run_number }}"
          body: "File APK Android Universal (Signed v1/v2/v3) siap diinstal langsung di perangkat Android."
          files: Xmusic.apk
