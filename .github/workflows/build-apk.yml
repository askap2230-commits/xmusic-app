name: Build Android APK (Tauri v2)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Platform 34, Build-Tools & NDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Setup Rust Toolchain & Android Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install NPM Dependencies
        run: npm install

      - name: Generate Tauri Icons (RGBA Ready)
        run: npx tauri icon app-icon.png

      - name: Initialize Tauri v2 Android Project
        run: npx tauri android init --ci --skip-targets-install

      - name: Configure Android Manifest & WebView Media Playback
        run: |
          MANIFEST="src-tauri/gen/android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            # Pastikan izin audio/penyimpanan dan cleartext traffic serta extractNativeLibs aktif agar APK dapat diinstal di semua Android
            sed -i 's/android:usesCleartextTraffic="${usesCleartextTraffic}"/android:usesCleartextTraffic="true" android:extractNativeLibs="true"/g' "$MANIFEST"
            if ! grep -q "READ_MEDIA_AUDIO" "$MANIFEST"; then
              sed -i 's|<uses-permission android:name="android.permission.INTERNET" />|<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />|g' "$MANIFEST"
            fi
            cat "$MANIFEST"
          fi

          # Aktifkan autoplay transisi lagu di WebView Android (MainActivity.kt)
          MAIN_KT=$(find src-tauri/gen/android -name "MainActivity.kt" | head -n 1)
          if [ -n "$MAIN_KT" ] && [ -f "$MAIN_KT" ]; then
            cat << 'EOF' > "$MAIN_KT"
package com.nys.xmusic

import android.os.Bundle
import android.webkit.WebView
import androidx.activity.enableEdgeToEdge

class MainActivity : TauriActivity() {
  override fun onCreate(savedInstanceState: Bundle?) {
    enableEdgeToEdge()
    super.onCreate(savedInstanceState)
  }

  override fun onWebViewCreate(webView: WebView) {
    super.onWebViewCreate(webView)
    webView.settings.mediaPlaybackRequiresUserGesture = false
    webView.settings.javaScriptCanOpenWindowsAutomatically = true
    webView.settings.domStorageEnabled = true
  }
}
EOF
            cat "$MAIN_KT"
          fi

      - name: Build Universal Release APK
        run: npx tauri android build --apk true

      - name: Align & Sign APK (v1 + v2 + v3 Signatures)
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          APK=$(find src-tauri/gen/android -name "*.apk" -path "*release*" | head -n 1)
          if [ -z "$APK" ]; then
            echo "Error: File APK hasil build tidak ditemukan!"
            exit 1
          fi
          echo "APK ditemukan: $APK"
          BT="$ANDROID_HOME/build-tools/34.0.0"

          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > ks.jks
            PASS="$KS_PASS"
          else
            PASS="xmusic123"
            rm -f ks.jks
            keytool -genkeypair -v -keystore ks.jks -alias xmusic -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" -dname "CN=Xmusic, OU=Mobile, O=Nys, L=Jakarta, S=DKI, C=ID"
          fi

          "$BT/zipalign" -v -f -p 4 "$APK" aligned.apk
          "$BT/apksigner" sign \
            --ks ks.jks \
            --ks-key-alias xmusic \
            --ks-pass pass:"$PASS" \
            --key-pass pass:"$PASS" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out Xmusic-v1.0.0-universal-release.apk \
            aligned.apk
          "$BT/apksigner" verify -v Xmusic-v1.0.0-universal-release.apk
          cp Xmusic-v1.0.0-universal-release.apk Xmusic.apk

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Xmusic-apk-signed
          path: |
            Xmusic.apk
            Xmusic-v1.0.0-universal-release.apk
          if-no-files-found: error
