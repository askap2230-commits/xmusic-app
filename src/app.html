<html lang="id" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" id="theme-color-meta" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>nys Xmusic</title>
    <link rel="manifest" href="%sveltekit.assets%/manifest.json" />
    <link rel="icon" type="image/png" href="%sveltekit.assets%/icon.png" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/icon.png" />
    <script>
      (function () {
        try {
          var mode = localStorage.getItem('nys_theme_mode') || 'system';
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = mode === 'dark' || (mode === 'system' && prefersDark);
          document.documentElement.classList.toggle('dark', isDark);
          var meta = document.getElementById('theme-color-meta');
          if (meta) meta.setAttribute('content', isDark ? '#000000' : '#f2f2f7');
        } catch (e) {}
      })();
    </script>
    %sveltekit.head%
  </head>
  <body
    data-sveltekit-preload-data="hover"
    class="bg-[#f2f2f7] text-zinc-950 antialiased dark:bg-black dark:text-white"
  >
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
