<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05060a">
<title>nys Xmusic</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<style>
/* ==========================================================================
   nys Xmusic v2.0 — Liquid Glass GPU-Accelerated Design System (60/120fps)
   Dioptimalkan khusus untuk Android WebView & Desktop Tauri v2:
   - Mengganti CSS filter:blur(110px) yang membebani GPU mobile dengan
     soft multi-stop radial-gradient + will-change: transform.
   - Menggunakan CSS containment (contain: content) pada area scroll.
   ========================================================================== */

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

:root {
  --bg: #05060a;
  --surface: rgba(18, 21, 34, 0.76);
  --text: #eef1f7;
  --muted: #a4abba;
  --muted-2: #767d8c;
  --accent: #b9cbff;
  --indigo: #6366f1;
  --fuchsia: #d946ef;
  --spotify: #1DB954;
  --danger: #ef4444;
  --amber: #f59e0b;
  --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
}

html, body {
  height: 100%;
  overscroll-behavior: none;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  user-select: none;
}

/* GPU-Friendly Ambient Background (Zero Heavy Blur Filter Overdraw) */
.bg {
  position: fixed;
  inset: 0;
  z-index: 0;
  overflow: hidden;
  pointer-events: none;
  background: #05060a;
}

.blob {
  position: absolute;
  border-radius: 50%;
  opacity: 0.85;
  will-change: transform;
  animation: drift 26s ease-in-out infinite alternate;
}

.b1 {
  width: 68vw;
  height: 68vw;
  left: -18vw;
  top: -22vw;
  background: radial-gradient(circle, rgba(42, 63, 122, 0.58) 0%, rgba(16, 26, 56, 0.28) 42%, transparent 70%);
}

.b2 {
  width: 62vw;
  height: 62vw;
  right: -16vw;
  top: -12vw;
  background: radial-gradient(circle, rgba(68, 42, 122, 0.52) 0%, rgba(24, 18, 51, 0.24) 44%, transparent 70%);
  animation-duration: 32s;
  animation-delay: -6s;
}

.b3 {
  width: 70vw;
  height: 70vw;
  left: 4vw;
  bottom: -30vw;
  background: radial-gradient(circle, rgba(16, 73, 79, 0.5) 0%, rgba(10, 31, 40, 0.22) 45%, transparent 70%);
  animation-duration: 36s;
  animation-delay: -12s;
}

@keyframes drift {
  from { transform: translate3d(0, 0, 0) scale(1); }
  to { transform: translate3d(3.5vw, 2.5vw, 0) scale(1.09); }
}

.glass {
  position: relative;
  background: linear-gradient(145deg, rgba(255, 255, 255, 0.14), rgba(255, 255, 255, 0.04) 42%, rgba(255, 255, 255, 0.08));
  border: 1px solid rgba(255, 255, 255, 0.12);
  backdrop-filter: blur(22px) saturate(165%);
  -webkit-backdrop-filter: blur(22px) saturate(165%);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.38), 0 18px 48px rgba(0, 0, 0, 0.45);
  overflow: hidden;
}

::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background: rgba(255, 255, 255, 0.16);
  border-radius: 6px;
}

/* MAIN GRID LAYOUT */
.app {
  position: relative;
  z-index: 1;
  display: grid;
  grid-template-columns: 248px 1fr;
  grid-template-rows: 1fr 94px;
  gap: 10px;
  height: 100vh;
  padding: 10px;
  transition: grid-template-columns 0.32s var(--ease);
}

.app.np-open {
  grid-template-columns: 248px 1fr 340px;
}

.sidebar {
  grid-column: 1;
  grid-row: 1;
  display: flex;
  flex-direction: column;
  gap: 10px;
  min-height: 0;
}

.main {
  grid-column: 2;
  grid-row: 1;
  border-radius: 26px;
  overflow-y: auto;
  overflow-x: hidden;
  scroll-behavior: smooth;
  contain: content;
}

.nowplaying {
  grid-column: 3;
  grid-row: 1;
  display: none;
  flex-direction: column;
  border-radius: 26px;
  padding: 16px;
  overflow-y: auto;
  gap: 14px;
}

.app.np-open .nowplaying {
  display: flex;
}

.player {
  grid-column: 1 / -1;
  grid-row: 2;
  border-radius: 28px;
  display: grid;
  grid-template-columns: 1.1fr 1.8fr 1.1fr;
  align-items: center;
  gap: 14px;
  padding: 0 18px;
}

.mobile-nav { display: none; }

/* SIDEBAR & LIQUID BUBBLE LENS */
.side-nav {
  padding: 10px;
  flex-shrink: 0;
  border-radius: 24px;
  position: relative;
}

.side-lib {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  padding: 10px;
  border-radius: 24px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 10px 12px;
}

.brand-mark {
  width: 32px;
  height: 32px;
  border-radius: 10px;
  display: grid;
  place-items: center;
  flex-shrink: 0;
  color: #05060a;
  background: linear-gradient(135deg, #38bdf8, #6366f1 55%, #a855f7);
  box-shadow: inset 0 1.5px 0 rgba(255, 255, 255, 0.6), 0 6px 18px rgba(99, 102, 241, 0.45);
}

.brand-name {
  font-size: 15px;
  font-weight: 800;
  letter-spacing: -0.02em;
}

.brand-badge {
  font-size: 9.5px;
  font-weight: 700;
  padding: 2px 6px;
  border-radius: 99px;
  background: rgba(185, 203, 255, 0.16);
  color: var(--accent);
  border: 1px solid rgba(185, 203, 255, 0.3);
}

.nav-container {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 9px 13px;
  border-radius: 999px;
  color: var(--muted);
  font-size: 13.5px;
  font-weight: 600;
  cursor: pointer;
  transition: color 0.22s var(--ease), background 0.22s;
  text-decoration: none;
  position: relative;
  z-index: 2;
  border: none;
  background: transparent;
  width: 100%;
  text-align: left;
  font-family: inherit;
}

.nav-item:hover { color: #fff; background: rgba(255, 255, 255, 0.05); }
.nav-item.active {
  color: #fff;
  background: linear-gradient(135deg, rgba(185, 203, 255, 0.28), rgba(99, 102, 241, 0.18));
  box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.45), 0 4px 14px rgba(0, 0, 0, 0.25);
}

.lib-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 2px 6px 10px;
}

.lib-title {
  display: flex;
  align-items: center;
  gap: 10px;
  background: none;
  border: none;
  color: var(--muted);
  font: inherit;
  font-size: 13.5px;
  font-weight: 700;
  cursor: pointer;
}

.icon-btn {
  background: none;
  border: none;
  color: var(--muted);
  width: 34px;
  height: 34px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  cursor: pointer;
  flex-shrink: 0;
  transition: color 0.18s, background 0.18s, transform 0.15s;
  position: relative;
}

.icon-btn:hover {
  color: #fff;
  background: rgba(255, 255, 255, 0.1);
}

.icon-btn.active {
  color: var(--spotify);
}

.lib-list {
  list-style: none;
  overflow-y: auto;
  flex: 1;
  padding: 0 2px 40px 0;
}

.lib-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 8px;
  border-radius: 12px;
  cursor: pointer;
  transition: background 0.18s;
}

.lib-item:hover, .lib-item.playing {
  background: rgba(255, 255, 255, 0.08);
}

.lib-thumb {
  width: 42px;
  height: 42px;
  border-radius: 10px;
  flex-shrink: 0;
  display: grid;
  place-items: center;
  border: 1px solid rgba(255, 255, 255, 0.14);
  overflow: hidden;
  background-size: cover;
  background-position: center;
}

.lib-info { min-width: 0; flex: 1; }
.lib-name {
  font-size: 13px;
  font-weight: 600;
  color: #fff;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.lib-sub {
  font-size: 11.5px;
  color: var(--muted);
  margin-top: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* TOPBAR */
.topbar {
  position: sticky;
  top: 12px;
  z-index: 20;
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 14px 18px 0;
  padding: 8px 12px 8px 14px;
  border-radius: 999px;
  background: rgba(14, 16, 26, 0.82);
  border: 1px solid rgba(255, 255, 255, 0.14);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  box-shadow: 0 10px 28px rgba(0, 0, 0, 0.35);
}

.search-box {
  display: flex;
  align-items: center;
  gap: 9px;
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 999px;
  padding: 0 14px;
  height: 38px;
  width: 320px;
  max-width: 48vw;
}

.search-box input {
  background: none;
  border: none;
  outline: none;
  color: #fff;
  font: inherit;
  font-size: 13.5px;
  width: 100%;
}

.topbar-spacer { flex: 1; }

.status-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 11px;
  border-radius: 999px;
  font-size: 11.5px;
  font-weight: 700;
  background: rgba(29, 185, 84, 0.14);
  color: #4ade80;
  border: 1px solid rgba(29, 185, 84, 0.3);
  cursor: pointer;
}

.user-chip {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: linear-gradient(135deg, #b9cbff, #6366f1 60%, #d946ef);
  border: 1px solid rgba(255, 255, 255, 0.35);
  color: #0a0c12;
  font-size: 14px;
  font-weight: 800;
  cursor: pointer;
  display: grid;
  place-items: center;
  overflow: hidden;
  background-size: cover;
  background-position: center;
  flex-shrink: 0;
}

/* CONTENT & CARDS */
.content {
  padding: 20px 20px 72px;
}

.section {
  margin-bottom: 32px;
}

.section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 14px;
  flex-wrap: wrap;
}

.section-head h2 {
  font-size: 19px;
  font-weight: 800;
  letter-spacing: -0.015em;
}

.hero {
  position: relative;
  padding: 28px 30px;
  border-radius: 32px 32px 32px 12px;
  background: linear-gradient(135deg, rgba(99, 102, 241, 0.22), rgba(18, 21, 34, 0.65) 55%, rgba(217, 70, 239, 0.16));
  border: 1px solid rgba(255, 255, 255, 0.14);
  margin-bottom: 28px;
  overflow: hidden;
}

.hero h1 {
  font-size: clamp(23px, 2.8vw, 34px);
  font-weight: 800;
  letter-spacing: -0.02em;
  line-height: 1.15;
}

.hero p {
  margin-top: 10px;
  font-size: 13.5px;
  color: var(--muted);
  line-height: 1.55;
  max-width: 620px;
}

.hero-actions {
  display: flex;
  gap: 9px;
  margin-top: 20px;
  flex-wrap: wrap;
}

.pill-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border: none;
  cursor: pointer;
  padding: 10px 18px;
  border-radius: 999px;
  font: inherit;
  font-size: 13px;
  font-weight: 700;
  transition: transform 0.16s, opacity 0.16s, background 0.2s;
}

.pill-btn:active { transform: scale(0.97); }
.pill-btn.primary { background: #fff; color: #05060a; }
.pill-btn.spotify { background: var(--spotify); color: #041f0e; }
.pill-btn.ghost {
  background: rgba(255, 255, 255, 0.08);
  color: #fff;
  border: 1px solid rgba(255, 255, 255, 0.15);
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(156px, 1fr));
  gap: 14px;
}

.card {
  position: relative;
  background: linear-gradient(150deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.03) 50%, rgba(255, 255, 255, 0.07));
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 18px;
  padding: 11px;
  cursor: pointer;
  transition: transform 0.22s var(--ease), border-color 0.22s;
}

.card:hover {
  transform: translateY(-4px);
  border-color: rgba(185, 203, 255, 0.32);
}

.card.playing {
  border-color: var(--spotify);
  box-shadow: 0 0 0 1px rgba(29, 185, 84, 0.35), 0 12px 28px rgba(0, 0, 0, 0.4);
}

.album-art {
  width: 100%;
  aspect-ratio: 1 / 1;
  border-radius: 12px;
  position: relative;
  overflow: hidden;
  margin-bottom: 10px;
  display: grid;
  place-items: center;
}

.album-art img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.local-cover-text {
  font-size: 44px;
  font-weight: 800;
  color: rgba(255, 255, 255, 0.92);
  position: relative;
  z-index: 1;
}

.art-meta {
  position: absolute;
  left: 8px;
  bottom: 7px;
  z-index: 2;
  font-size: 9.5px;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 99px;
  background: rgba(0, 0, 0, 0.58);
  color: rgba(255, 255, 255, 0.88);
}

.card h3 {
  font-size: 13.5px;
  font-weight: 700;
  margin-bottom: 3px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.card p {
  font-size: 12px;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.card-play {
  position: absolute;
  right: 16px;
  bottom: 68px;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: #fff;
  border: none;
  color: #05060a;
  display: grid;
  place-items: center;
  cursor: pointer;
  opacity: 0;
  transform: translateY(5px);
  transition: opacity 0.22s, transform 0.22s;
  z-index: 4;
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.45);
}

.card:hover .card-play, .card.playing .card-play {
  opacity: 1;
  transform: translateY(0);
}

.card-actions-top {
  position: absolute;
  top: 16px;
  right: 16px;
  display: flex;
  gap: 5px;
  z-index: 5;
}

.card-mini-btn {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: rgba(5, 6, 10, 0.68);
  border: 1px solid rgba(255, 255, 255, 0.18);
  color: #fff;
  display: grid;
  place-items: center;
  cursor: pointer;
  font-size: 12px;
}

.card-mini-btn.liked {
  color: #f43f5e;
  border-color: rgba(244, 63, 94, 0.45);
}

/* EQUALIZER STUDIO RACK */
.eq-rack {
  background: rgba(12, 15, 26, 0.75);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 24px;
  padding: 20px;
  margin-bottom: 24px;
}

.eq-presets {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin: 14px 0 20px;
}

.chip {
  padding: 7px 14px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.07);
  color: var(--muted);
  border: 1px solid rgba(255, 255, 255, 0.12);
  font: inherit;
  font-size: 12.5px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.18s;
}

.chip.active {
  background: #fff;
  color: #05060a;
  border-color: #fff;
}

.eq-sliders-grid {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 12px;
  align-items: center;
  text-align: center;
  padding: 12px 6px;
  background: rgba(0, 0, 0, 0.28);
  border-radius: 18px;
}

.eq-col {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}

.eq-db {
  font-size: 11px;
  font-weight: 700;
  color: var(--accent);
}

.eq-range {
  writing-mode: vertical-lr;
  direction: rtl;
  height: 130px;
  width: 24px;
  accent-color: var(--spotify);
  cursor: pointer;
}

.eq-freq {
  font-size: 12px;
  font-weight: 700;
  color: #fff;
}

.eq-sub {
  font-size: 10px;
  color: var(--muted);
}

/* PLAYER FOOTER */
.np-left {
  display: flex;
  align-items: center;
  gap: 11px;
  min-width: 0;
  cursor: pointer;
}

.np-art {
  width: 54px;
  height: 54px;
  border-radius: 14px;
  flex-shrink: 0;
  position: relative;
  overflow: hidden;
  display: grid;
  place-items: center;
  border: 1px solid rgba(255, 255, 255, 0.16);
}

.np-art img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.np-meta { min-width: 0; flex: 1; }
.np-title {
  display: block;
  font-size: 13.5px;
  font-weight: 700;
  color: #fff;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.np-artist {
  display: block;
  font-size: 11.5px;
  color: var(--muted);
  margin-top: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.np-center {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 7px;
  width: 100%;
}

.controls {
  display: flex;
  align-items: center;
  gap: 10px;
}

.play-btn {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: #fff;
  border: none;
  color: #05060a;
  display: grid;
  place-items: center;
  cursor: pointer;
  flex-shrink: 0;
}

.seek-row {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  max-width: 580px;
}

.time {
  font-size: 11px;
  color: var(--muted);
  min-width: 34px;
  text-align: center;
  font-variant-numeric: tabular-nums;
}

.progress {
  position: relative;
  height: 6px;
  flex: 1;
  background: rgba(255, 255, 255, 0.16);
  border-radius: 99px;
  cursor: pointer;
  touch-action: none;
}

.progress-fill {
  position: absolute;
  left: 0;
  top: 0;
  height: 100%;
  background: linear-gradient(90deg, var(--accent), #fff);
  border-radius: 99px;
  pointer-events: none;
}

.np-right {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 6px;
}

.repeat-badge {
  position: absolute;
  top: 3px;
  right: 3px;
  font-size: 8.5px;
  font-weight: 900;
  background: var(--spotify);
  color: #000;
  width: 13px;
  height: 13px;
  border-radius: 50%;
  display: grid;
  place-items: center;
}

/* DYNAMIC ISLAND BAR */
.dynamic-bar {
  position: fixed;
  top: calc(env(safe-area-inset-top, 0px) + 10px);
  left: 50%;
  transform: translateX(-50%);
  z-index: 150;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 8px 6px 10px;
  background: rgba(10, 12, 20, 0.9);
  border: 1px solid rgba(255, 255, 255, 0.2);
  border-radius: 999px;
  backdrop-filter: blur(20px);
  box-shadow: 0 12px 34px rgba(0, 0, 0, 0.55);
  min-width: 230px;
  max-width: min(420px, calc(100vw - 24px));
  cursor: pointer;
}

.db-pulse {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #34d399;
  flex-shrink: 0;
}

.dynamic-bar.paused .db-pulse { background: var(--amber); }

/* MODALS */
.modal-overlay {
  position: fixed;
  inset: 0;
  z-index: 210;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
}

.modal-backdrop {
  position: absolute;
  inset: 0;
  background: rgba(0, 0, 0, 0.78);
  backdrop-filter: blur(18px);
}

.modal-card {
  position: relative;
  z-index: 1;
  width: min(450px, calc(100vw - 28px));
  background: #11131e;
  border: 1px solid rgba(255, 255, 255, 0.16);
  border-radius: 26px;
  padding: 22px 20px;
  max-height: 88dvh;
  overflow-y: auto;

const DB_NAME = 'nys_xmusic_db', STORE_TRACKS = 'local_tracks';
let db = null;
const objUrlCache = new Map(), covUrlCache = new Map();

function openDB() {
  if (db) return Promise.resolve(db);
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, 2);
    r.onupgradeneeded = e => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains(STORE_TRACKS)) d.createObjectStore(STORE_TRACKS, { keyPath: 'id' });
    };
    r.onsuccess = e => { db = e.target.result; res(db); };
    r.onerror = e => rej(e);
  });
}

function hydrateTrack(t) {
  const c = { ...t, source: t.source || 'local' };
  if (c.blob instanceof Blob) {
    if (!objUrlCache.has(c.id)) objUrlCache.set(c.id, URL.createObjectURL(c.blob));
    c.url = objUrlCache.get(c.id);
  }
  if (c.coverBlob instanceof Blob) {
    if (!covUrlCache.has(c.id)) covUrlCache.set(c.id, URL.createObjectURL(c.coverBlob));
    c.imageUrl = covUrlCache.get(c.id);
  }
  return c;
}

async function saveLocalTrack(t) {
  const d = await openDB();
  return new Promise((res, rej) => {
    const tx = d.transaction(STORE_TRACKS, 'readwrite');
    tx.objectStore(STORE_TRACKS).put(t);
    tx.oncomplete = () => res(hydrateTrack(t));
    tx.onerror = e => rej(e);
  });
}

async function getAllLocalTracks() {
  const d = await openDB();
  return new Promise((res, rej) => {
    const tx = d.transaction(STORE_TRACKS, 'readonly');
    const r = tx.objectStore(STORE_TRACKS).getAll();
    r.onsuccess = () => {
      const list = (r.result || []).map(hydrateTrack);
      list.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
      res(list);
    };
    r.onerror = e => rej(e);
  });
}

}

    const d = await r.json();

      spTokenCache = { token: d.access_token, exp: Date.now() + (Number(d.expires_in) || 3600) * 1000 };
      return d.access_token;
    }
  } catch {}
  return null;
}

async function fetchSpotifyMetadata(type, id, rawUrl) {
  const token = await getSpotifyToken();
  if (token && type && id) {
    try {
      const ep = type === 'track' ? `https://api.spotify.com/v1/tracks/${id}`
        : type === 'album' ? `https://api.spotify.com/v1/albums/${id}`
        : type === 'playlist' ? `https://api.spotify.com/v1/playlists/${id}` : null;
      if (ep) {
        const r = await fetch(ep, { headers: { Authorization: `Bearer ${token}` } });
        if (r.ok) {
          const d = await r.json();
          if (type === 'track') {
            return {
              via: 'Spotify Web API v1',
              title: d.name || 'Spotify Track',
              artist: (d.artists || []).map(a => a.name).join(', ') || 'Spotify',
              album: d.album?.name || 'Spotify',
              dur: Math.round((Number(d.duration_ms) || 0) / 1000),
              imageUrl: d.album?.images?.[0]?.url || null
            };
          }
          return {
            via: 'Spotify Web API v1',
            title: d.name || 'Spotify',
            artist: d.artists ? d.artists.map(a => a.name).join(', ') : (d.owner?.display_name || 'Spotify'),
            album: 'Spotify',
            dur: 0,
            imageUrl: d.images?.[0]?.url || null
          };
        }
      }
    } catch {}
  }
  try {
    const r = await fetch(`https://open.spotify.com/oembed?url=${encodeURIComponent(rawUrl)}`);
    if (r.ok) {
      const o = await r.json();
      let title = o.title || 'Spotify Track', artist = o.author_name || 'Spotify';
      if (title.includes(' - ') && (!o.author_name || o.author_name === 'Spotify')) {
        const p = title.split(' - '); title = p[0].trim(); artist = p.slice(1).join(' - ').trim();
      }
      return { via: 'Spotify oEmbed', title, artist, album: 'Spotify', dur: 0, imageUrl: o.thumbnail_url || null };
    }
  } catch {}
  return null;
}

async function fetchSyncedLyrics(title, artist, dur = 0) {
  if (!title) return null;
  const ct = String(title).replace(/\(.*?\)|\[.*?\]/g, '').trim();
  const ca = String(artist || '').split(',')[0].trim();
  try {
    const p = new URLSearchParams({ track_name: ct, artist_name: ca });
    if (dur > 0) p.set('duration', String(Math.round(dur)));
    const r = await fetch(`https://lrclib.net/api/get?${p.toString()}`);
    if (r.ok) { const d = await r.json(); if (d.syncedLyrics || d.plainLyrics) return d.syncedLyrics || d.plainLyrics; }
  } catch {}
  try {
    const r = await fetch(`https://lrclib.net/api/search?q=${encodeURIComponent(ct + ' ' + ca)}`);
    if (r.ok) {
      const list = await r.json();
      if (Array.isArray(list) && list.length) {
        const best = list.find(x => x.syncedLyrics) || list[0];
        return best.syncedLyrics || best.plainLyrics || null;
      }
    }
  } catch {}
  return null;
}

function parseLrcLyrics(raw) {
  if (!raw || !String(raw).trim()) return [];
  const lines = String(raw).split(/\r?\n/), out = [], rx = /\[(\d{1,2}):(\d{2})(?:\.(\d{1,3}))?\]/g;
  for (const line of lines) {
    const ms = [...line.matchAll(rx)], text = line.replace(rx, '').trim();
    if (ms.length && text) {
      for (const m of ms) {
        const t = (Number(m[1])||0)*60 + (Number(m[2])||0) + Number((m[3]||'0').padEnd(3,'0').slice(0,3))/1000;
        out.push({ time: t, text, synced: true });
      }
    } else if (text && !line.startsWith('[')) {
      out.push({ time: null, text, synced: false });
    }
  }
  return out.some(x => x.synced) ? out.filter(x => x.synced).sort((a,b) => a.time - b.time) : out;
}

function extractYouTubeId(url) {
  const c = String(url || '').trim();
  if (c.includes('youtu.be/')) return c.split('youtu.be/')[1].split(/[?&/]/)[0];
  if (c.includes('/shorts/')) return c.split('/shorts/')[1].split(/[?&/]/)[0];
  if (c.includes('v=')) return c.split('v=')[1].split('&')[0];
  return '';
}

function extractSpotifyEmbed(url) {
  const c = String(url || '').trim();
  if (!c.includes('spotify.com')) return null;
  try {
    const u = new URL(c), p = u.pathname.split('/').filter(Boolean).filter(x => !x.startsWith('intl-'));
    if (p[0] && p[1]) return { type: p[0], id: p[1] };
  } catch {}
  return null;
}

function showToast(msg) {

}

function ensureWebAudio() {
  if (player.webAudioReady) return;
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext; if (!Ctx) return;
    player.audioCtx = new Ctx();
    const src = player.audioCtx.createMediaElementSource(audioEl);
    player.preampNode = player.audioCtx.createGain();
    player.filterNodes = EQ_BANDS.map((b, i) => {
      const f = player.audioCtx.createBiquadFilter();
      f.type = b.type; f.frequency.value = b.freq; f.Q.value = 1.1; f.gain.value = player.eqEnabled ? (player.gains[i]||0) : 0;
      return f;
    });
    player.analyserNode = player.audioCtx.createAnalyser();
    let prev = src; prev.connect(player.preampNode); prev = player.preampNode;
    for (const f of player.filterNodes) { prev.connect(f); prev = f; }
    prev.connect(player.analyserNode); player.analyserNode.connect(player.audioCtx.destination);
    player.webAudioReady = true; syncEqNodes();
  } catch {}
}

function syncEqNodes() {
  saveJSON('nys_eq_state', { eqEnabled: player.eqEnabled, eqPreset: player.eqPreset, preamp: player.preamp, gains: [...player.gains], pan: player.pan });
  if (!player.webAudioReady || !player.audioCtx) return;
  const now = player.audioCtx.currentTime;
  player.preampNode.gain.setTargetAtTime(Math.pow(10, (player.eqEnabled ? player.preamp : 0) / 20), now, 0.015);
  player.filterNodes.forEach((f, i) => f.gain.setTargetAtTime(player.eqEnabled ? (player.gains[i]||0) : 0, now, 0.015));
}

function playTrack(track) {
  if (!track) return;
  if (!player.queue.some(x => x.id === track.id)) player.queue = [track, ...player.queue];
  if (track.videoId || track.spotifyId) {
    audioEl.pause(); player.current = track; state.modalTrack = track; state.trackModalOpen = true; renderApp(); return;
  }
  if (player.current && player.current.id === track.id) {
    if (player.playing) audioEl.pause(); else { ensureWebAudio(); audioEl.play(); }
    return;
  }
  ensureWebAudio();
  state.dynamicBarDismissed = false; player.current = track; player.position = 0; player.duration = track.dur || 0;
  audioEl.crossOrigin = 'anonymous'; audioEl.src = track.url; audioEl.load();
  audioEl.playbackRate = player.playbackRate;
  audioEl.play().catch(e => showToast('Gagal memutar: ' + e.message));
  renderApp();
}

  document.querySelectorAll('.js-seek-fill').forEach(el => el.style.width = pct + '%');

  const activeTrack = state.trackModalOpen ? state.modalTrack : player.current;
  if (activeTrack && activeTrack.lyrics) {
    const lines = parseLrcLyrics(activeTrack.lyrics);
    if (lines.length && lines[0].synced) {

      for (let i = 0; i < lines.length; i++) { if (lines[i].time <= player.position + 0.15) idx = i; else break; }

});

          <div style="display:flex;gap:8px;margin-bottom:12px;">
            <button class="pill-btn primary" style="flex:1;" id="btnProcessHub">Deteksi & Muat</button>
            <button class="pill-btn ghost" id="btnHubApiKey">🔑 API Key</button>
          </div>
          ${state.hubMeta ? `<div style="display:flex;gap:12px;align-items:center;padding:12px;background:rgba(255,255,255,.06);border-radius:14px;margin-bottom:12px;">${state.hubMeta.imageUrl ? `<img src="${esc(state.hubMeta.imageUrl)}" style="width:56px;height:56px;border-radius:10px;object-fit:cover;">` : ''}<div><div style="font-weight:800;">${esc(state.hubMeta.title)}</div><div style="font-size:12px;color:var(--accent);">${esc(state.hubMeta.artist)}</div><div style="font-size:10.5px;color:var(--muted);">Via ${esc(state.hubMeta.via)}</div></div></div>` : ''}
          ${state.hubMsg ? `<div style="font-size:12px;color:var(--accent);margin-bottom:10px;">${esc(state.hubMsg)}</div>` : ''}
          ${state.hubEmbed ? `<button class="pill-btn spotify" style="width:100%;margin-bottom:10px;" id="btnSaveHub">＋ Simpan Sampul, Lagu & Lirik ke Koleksi</button>` : ''}
          <button class="pill-btn ghost" style="width:100%;" id="btnCloseHub2">Tutup</button>
        </div>
      </div>`;
  }

  if (state.editProfileOpen) {
    modalsHTML += `
      <div class="modal-overlay">
        <div class="modal-backdrop" id="btnCloseApiModal"></div>
        <div class="modal-card">
          <h3 style="font-size:18px;font-weight:800;margin-bottom:12px;">Profil & Spotify API Key</h3>
          <div class="field-group"><label class="field-label">Spotify Client ID</label><input id="inpSpId" class="field-input" type="text" value="${esc(apiConfig.spotifyClientId)}"></div>
          <div class="field-group"><label class="field-label">Spotify Client Secret</label><input id="inpSpSec" class="field-input" type="password" value="${esc(apiConfig.spotifyClientSecret)}"></div>
          <div class="field-group"><label class="field-label">Nama Tampilan</label><input id="inpProfName" class="field-input" type="text" value="${esc(state.userProfile.name)}"></div>
          <div style="display:flex;gap:8px;margin-top:12px;"><button class="pill-btn ghost" style="flex:1;" id="btnCloseApiModal2">Batal</button><button class="pill-btn spotify" style="flex:1;" id="btnSaveApi">Simpan</button></div>
        </div>
      </div>`;
  }

  const dbHTML = (cur && !state.dynamicBarDismissed) ? `
    <div class="dynamic-bar ${player.playing ? '' : 'paused'}" id="dynamicBar" style="${cur.imageUrl ? `background-image:url('${esc(cur.imageUrl)}')` : `background:linear-gradient(135deg,${cur.c1||'#6366f1'},${cur.c2||'#1e1b4b'})`}">
      <span class="db-pulse"></span>
      <div class="db-art" style="${cur.imageUrl ? '' : `background:linear-gradient(135deg,${cur.c1||'#6366f1'},${cur.c2||'#1e1b4b'})`}">
        ${cur.imageUrl ? `<img src="${esc(cur.imageUrl)}" alt="">` : `<span style="font-size:13px;font-weight:800;color:#fff;">${esc((cur.title||'?')[0].toUpperCase())}</span>`}
      </div>
      <div style="min-width:0;flex:1;text-shadow:0 1px 4px rgba(0,0,0,.7);">
        <div style="font-size:12px;font-weight:800;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(cur.title)}</div>
        <div style="font-size:10.5px;color:rgba(255,255,255,.88);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(cur.artist)}</div>
      </div>
      <button class="play-btn" id="btnDbPlay" style="width:30px;height:30px;">${player.playing ? '⏸' : '▶'}</button>
      <button class="icon-btn" id="btnDbClose" style="width:24px;height:24px;color:#fff;">✕</button>
    </div>` : '';

  root.innerHTML = `
    ${dbHTML}
    <div class="app">
      <aside class="sidebar">
        <nav class="glass side-nav">
          <div class="brand"><span class="brand-mark">♪</span><span class="brand-name">nys Xmusic</span><span class="brand-badge">SK3</span></div>
          <div class="nav-container">
            <button class="nav-item ${state.view === 'home' ? 'active' : ''}" data-nav="home">🏠 Beranda</button>
            <button class="nav-item ${state.view === 'library' ? 'active' : ''}" data-nav="library">📚 Perpustakaan (${state.localTracks.length})</button>
            <button class="nav-item ${state.view === 'eq' ? 'active' : ''}" data-nav="eq">🎛️ Equalizer</button>
            <button class="nav-item" id="sideHub">🔗 Hub Spotify & YT</button>
            <button class="nav-item ${state.view === 'profile' ? 'active' : ''}" data-nav="profile">🔑 Profil & API Key</button>
          </div>
        </nav>
      </aside>
      <main class="glass main">
        <header class="topbar">
          <div class="search-box"><span>🔍</span><input type="text" id="inpSearch" placeholder="Cari lagu..." value="${esc(state.searchQuery)}"></div>
          <div class="topbar-spacer"></div>
          <button class="user-chip" data-nav="profile">${esc((state.userProfile.name||'N')[0].toUpperCase())}</button>
        </header>
        <div class="content">${mainContent}</div>
      </main>
      <footer class="glass player">
        <div class="np-left" id="btnOpenCurModal"><div class="np-meta"><span class="np-title">${esc(cur?.title || 'Belum ada lagu')}</span><span class="np-artist">${esc(cur?.artist || 'Ketuk 2x kartu untuk lirik')}</span></div></div>
        <div class="np-center">
          <div class="controls"><button class="play-btn" id="btnPlayPause">${player.playing ? '⏸' : '▶'}</button></div>
          <div class="seek-row"><span class="time js-cur-time">${fmt(player.position)}</span><div class="progress" id="barSeek"><div class="progress-fill js-seek-fill" style="width:${pct}%"></div></div><span class="time">${fmt(player.duration)}</span></div>
        </div>
        <div class="np-right"><button class="play-btn m-only" id="btnPlayPauseMob">${player.playing ? '⏸' : '▶'}</button></div>
      </footer>
      <nav class="glass mobile-nav">
        <button class="m-nav-item ${state.view === 'home' ? 'active' : ''}" data-nav="home"><span>🏠</span><span>Beranda</span></button>
        <button class="m-nav-item ${state.view === 'library' ? 'active' : ''}" data-nav="library"><span>📚</span><span>Pustaka</span></button>
        <button class="m-nav-item ${state.view === 'eq' ? 'active' : ''}" data-nav="eq"><span>🎛️</span><span>EQ</span></button>
        <button class="m-nav-item" id="mobHub"><span>🔗</span><span style="color:#1DB954;">Spotify</span></button>
        <button class="m-nav-item ${state.view === 'profile' ? 'active' : ''}" data-nav="profile"><span>🔑</span><span>API Key</span></button>
      </nav>
    </div>
    ${modalsHTML}
  `;
  bindEvents();
}

let tapMap = new Map();
function bindEvents() {
  const on = (sel, ev, fn) => { const el = document.querySelector(sel); if (el) el.addEventListener(ev, fn); };
  document.querySelectorAll('[data-nav]').forEach(el => el.addEventListener('click', () => { state.view = el.dataset.nav; renderApp(); }));
  document.querySelectorAll('[data-card]').forEach(el => el.addEventListener('click', async e => {
    if (e.target.closest('button')) return;
    const id = el.dataset.card, t = getAllTracks().find(x => x.id === id); if (!t) return;
    const now = Date.now(), last = tapMap.get(id) || 0; tapMap.set(id, now);
    if (now - last < 320) {
      tapMap.set(id, 0);
      if (player.current?.id !== id) playTrack(t);
      if (state.flippedGridIds.has(id)) state.flippedGridIds.delete(id); else { state.flippedGridIds.add(id); if (!t.lyrics) { const l = await fetchSyncedLyrics(t.title, t.artist, t.dur); if (l) t.lyrics = l; } }
      renderApp(); return;
    }
    playTrack(t); state.modalTrack = t; state.trackModalOpen = true; state.modalFlipped = false; renderApp();
  }));
  document.querySelectorAll('[data-flip]').forEach(el => el.addEventListener('click', async e => {
    e.stopPropagation();
    const id = el.dataset.flip, t = getAllTracks().find(x => x.id === id);
    if (state.flippedGridIds.has(id)) state.flippedGridIds.delete(id);
    else { state.flippedGridIds.add(id); if (t && !t.lyrics) { const l = await fetchSyncedLyrics(t.title, t.artist, t.dur); if (l) t.lyrics = l; } }
    renderApp();
  }));
  document.querySelectorAll('[data-open-modal-lrc]').forEach(el => el.addEventListener('click', e => {
    e.stopPropagation();
    const t = getAllTracks().find(x => x.id === el.dataset.openModalLrc);
    if (t) { state.modalTrack = t; state.trackModalOpen = true; state.modalFlipped = true; renderApp(); }
  }));
  let modalLastTap = 0;
  const doFlipModal = async () => {
    state.modalFlipped = !state.modalFlipped;
    renderApp();
    if (state.modalFlipped && state.modalTrack && !state.modalTrack.lyrics) {
      state.fetchingLyrics = true; renderApp();
      const l = await fetchSyncedLyrics(state.modalTrack.title, state.modalTrack.artist, state.modalTrack.dur);
      state.fetchingLyrics = false;
      if (l) {
        state.modalTrack.lyrics = l;
        if (state.modalTrack.source === 'local') await saveLocalTrack(state.modalTrack);
      }
      renderApp();
    }
  };
  on('#modalFlipCard', 'click', e => {
    if (e.target.closest('button, input, textarea, .progress, .lyric-line')) return;
    const now = Date.now();
    if (now - modalLastTap < 350) { modalLastTap = 0; doFlipModal(); }
    else modalLastTap = now;
  });
  on('#modalFlipCard', 'dblclick', e => {
    if (e.target.closest('button, input, textarea, .progress, .lyric-line')) return;
    modalLastTap = 0; doFlipModal();
  });
  on('#btnFlipModalBack2', 'click', doFlipModal);
  on('#btnFetchLrcModal', 'click', async () => {
    if (!state.modalTrack) return;
    state.fetchingLyrics = true; renderApp();
    const l = await fetchSyncedLyrics(state.modalTrack.title, state.modalTrack.artist, state.modalTrack.dur);
    state.fetchingLyrics = false;
    if (l) {
      state.modalTrack.lyrics = l;
      if (state.modalTrack.source === 'local') await saveLocalTrack(state.modalTrack);
      showToast('Lirik sinkron ditemukan!');
    } else showToast('Lirik belum ditemukan. Gunakan tombol Edit Lirik.');
    renderApp();
  });
  on('#btnEditLrcModal', 'click', () => {
    if (!state.modalTrack) return;
    const txt = prompt('Tempel lirik lagu (format LRC [mm:ss.xx] atau teks biasa):', state.modalTrack.lyrics || '');
    if (txt !== null) {
      state.modalTrack.lyrics = txt;
      if (state.modalTrack.source === 'local') saveLocalTrack(state.modalTrack);
      renderApp();
    }
  });
  document.querySelectorAll('[data-seek]').forEach(el => el.addEventListener('click', () => {
    const s = Number(el.dataset.seek);
    if (Number.isFinite(s) && s >= 0 && player.current) { audioEl.currentTime = s; }
  }));
  document.querySelectorAll('[data-card-back]').forEach(el => el.addEventListener('click', e => {
    if (e.target.closest('button')) return;
    const id = el.dataset.cardBack;
    const now = Date.now(), last = tapMap.get('b_' + id) || 0; tapMap.set('b_' + id, now);
    if (now - last < 350) { tapMap.set('b_' + id, 0); state.flippedGridIds.delete(id); renderApp(); }
  }));
  const flipModal = async () => {
    state.modalFlipped = !state.modalFlipped;
    if (state.modalFlipped && state.modalTrack && !state.modalTrack.lyrics) {
      const l = await fetchSyncedLyrics(state.modalTrack.title, state.modalTrack.artist, state.modalTrack.dur);
      if (l) state.modalTrack.lyrics = l;
    }
    renderApp();
  };
  on('#btnFlipModal', 'click', flipModal); on('#btnFlipModal2', 'click', flipModal); on('#btnFlipModalBack', 'click', flipModal);
  on('#btnCloseTrackModal', 'click', () => { state.trackModalOpen = false; renderApp(); });
  on('#btnCloseTrackModal2', 'click', () => { state.trackModalOpen = false; renderApp(); });
  on('#btnOpenCurModal', 'click', () => { if (player.current) { state.modalTrack = player.current; state.trackModalOpen = true; renderApp(); } });
  on('#dynamicBar', 'click', e => { if (!e.target.closest('button') && player.current) { state.modalTrack = player.current; state.trackModalOpen = true; renderApp(); } });
  on('#btnDbPlay', 'click', e => { e.stopPropagation(); document.getElementById('btnPlayPause')?.click(); });
  on('#btnDbClose', 'click', e => { e.stopPropagation(); state.dynamicBarDismissed = true; renderApp(); });

  on('#btnOpenHub', 'click', () => { state.hubModalOpen = true; renderApp(); });
  on('#sideHub', 'click', () => { state.hubModalOpen = true; renderApp(); });
  on('#mobHub', 'click', () => { state.hubModalOpen = true; renderApp(); });
  on('#btnCloseHub', 'click', () => { state.hubModalOpen = false; renderApp(); });
  on('#btnCloseHub2', 'click', () => { state.hubModalOpen = false; renderApp(); });
  on('#btnHubApiKey', 'click', () => { state.hubModalOpen = false; state.editProfileOpen = true; renderApp(); });
  on('#btnOpenApiModal', 'click', () => { state.editProfileOpen = true; renderApp(); });
  on('#btnCloseApiModal', 'click', () => { state.editProfileOpen = false; renderApp(); });
  on('#btnCloseApiModal2', 'click', () => { state.editProfileOpen = false; renderApp(); });

  on('#btnSaveApi', 'click', () => {
    apiConfig.spotifyClientId = document.getElementById('inpSpId')?.value.trim() || '';
    apiConfig.spotifyClientSecret = document.getElementById('inpSpSec')?.value.trim() || '';
    state.userProfile.name = document.getElementById('inpProfName')?.value.trim() || 'Nys';
    spTokenCache = { token: null, exp: 0 };
    saveJSON('nys_api_config', apiConfig); saveJSON('nys_profile', state.userProfile);
    state.editProfileOpen = false; showToast('Spotify API Key & Profil disimpan!'); renderApp();
  });

  on('#btnProcessHub', 'click', async () => {
    const url = document.getElementById('inpHubUrl')?.value.trim() || '';
    state.hubUrl = url;
    const sp = extractSpotifyEmbed(url);
    if (sp) {
      state.hubEmbed = sp; state.hubMsg = 'Mendeteksi gambar, nama lagu & artis...'; renderApp();
      state.hubMeta = await fetchSpotifyMetadata(sp.type, sp.id, url);
      state.hubMsg = state.hubMeta ? `Terdeteksi (${state.hubMeta.via}): ${state.hubMeta.title} — ${state.hubMeta.artist}` : 'Pemutar Spotify siap.';
      renderApp();
    } else showToast('Masukkan link Spotify yang valid!');
  });

  on('#btnSaveHub', 'click', async () => {
    if (!state.hubEmbed) return;
    const title = state.hubMeta?.title || 'Spotify Track', artist = state.hubMeta?.artist || 'Spotify';
    const lrc = await fetchSyncedLyrics(title, artist, state.hubMeta?.dur || 0);
    const t = {
      id: 'embed_' + Date.now(), title, artist, album: state.hubMeta?.album || 'Spotify',
      imageUrl: state.hubMeta?.imageUrl || null, dur: state.hubMeta?.dur || 0,
      c1: '#1DB954', c2: '#0b0b12', source: 'local', createdAt: Date.now(),
      lyrics: lrc || '', spotifyId: state.hubEmbed.id, spotifyType: state.hubEmbed.type
    };
    await saveLocalTrack(t); state.localTracks = await getAllLocalTracks();
    state.hubModalOpen = false; state.view = 'library'; showToast('Sampul, lagu & lirik disimpan!'); renderApp();
  });

  on('#btnPlayPause', 'click', () => { if (!player.current && player.queue[0]) playTrack(player.queue[0]); else if (player.playing) audioEl.pause(); else { ensureWebAudio(); audioEl.play(); } });
  on('#btnPlayPauseMob', 'click', () => document.getElementById('btnPlayPause')?.click());
  on('#btnGenDemo', 'click', async () => {
    showToast('Menyintesis lagu demo 44.1kHz...');
    const wav = await generateDemoSynthBlob(24);
    const demo = {
      id: 'local_demo_synthwave', title: 'Midnight Drive (Built-in Synth)', artist: 'nys Xmusic Studio',
      album: 'Offline Synth Engine', blob: wav, dur: 24, c1: '#38bdf8', c2: '#4f46e5', source: 'local', createdAt: Date.now(),
      lyrics: '[00:00.00] 🎵 nys Xmusic Built-in Synthwave\n[00:04.00] Ketuk 2x kartu untuk membalik & melihat lirik sinkron\n[00:08.50] Lirik berjalan otomatis mengikuti irama lagu\n[00:14.00] Ketuk baris lirik untuk melompat ke detik tersebut\n[00:20.00] Siap digunakan kapan saja 100% offline!'
    };
    await saveLocalTrack(demo); state.localTracks = await getAllLocalTracks();
    const h = state.localTracks.find(x => x.id === demo.id); if (h) playTrack(h);
  });
}

(async function init() {
  try { await openDB(); state.localTracks = await getAllLocalTracks(); } catch {}
  renderApp();
  state.trendingTracks = await audiusFetch('/tracks/trending?limit=32');
  state.loadingHome = false; player.queue = [...state.localTracks, ...state.trendingTracks];
  renderApp();
})();
</script>
</body>
</html>
